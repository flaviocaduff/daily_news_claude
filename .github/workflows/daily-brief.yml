name: Daily Brief

on:
  schedule:
    # 06:30 Zurich (cron is UTC: 04:30 in summer, 05:30 in winter; the gate skips the wrong one).
    # GitHub's scheduler has not fired on this repo so far; the routine below is the primary trigger.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  # Primary trigger: a Claude cloud routine (claude.ai/code/routines) pushes an empty commit to
  # claude/brief-YYYY-MM-DD at 06:30 Zurich (claude/brief-test-* = forced test build). The branch is deleted afterwards.
  push:
    branches: ["claude/brief-*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: no Claude, no publish, no notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate (06:20 Zurich, once per day)
        id: gate
        run: |
          case "${{ github.event_name }}:${{ github.ref_name }}" in
            workflow_dispatch:*|push:claude/brief-test-*) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          now=$(TZ=Europe/Zurich date +%H%M); today=$(TZ=Europe/Zurich date +%F)
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          if [ "$now" -lt 620 ]; then
            echo "Skipping: $now is before 06:20 Zurich"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" gh-pages >/dev/null &&
               curl -sfI "https://${owner,,}.github.io/${repo}/archive/$today.html" >/dev/null; then
            echo "Skipping: today's brief ($today) is already published"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      # Bring back the previously published site so the archive keeps growing.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true   # first run: gh-pages does not exist yet
        with:
          ref: gh-pages
          path: site

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'

      - name: Test build (no Claude)
        if: steps.gate.outputs.run == 'true' && inputs.dry_run
        run: uv run daily-brief --no-llm

      # Summaries run on the Claude subscription: token from `claude setup-token`.
      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        run: npm install -g @anthropic-ai/claude-code

      # Fails in seconds on a bad/expired token; prints only non-secret facts about it.
      - name: Check Claude token
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          t="$CLAUDE_CODE_OAUTH_TOKEN"
          echo "length: ${#t}"
          case "$t" in sk-ant-oat*) echo "prefix: ok";; *) echo "prefix: NOT sk-ant-oat";; esac
          bad=$(printf '%s' "$t" | tr -d 'A-Za-z0-9_-' | wc -c); echo "unexpected chars: $bad"
          claude --version
          cd "$(mktemp -d)" && claude -p "say ok" --tools "" --no-session-persistence

      # `uv run` installs the locked deps, including edge-tts for the audio overview (free, no key; it needs
      # network to Microsoft's speech service and the build carries on without the player if that fails).
      - name: Build brief
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run daily-brief

      # The restored gh-pages checkout brings its own .git, which breaks the publish action.
      - name: Drop restored git metadata
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        run: rm -rf site/.git

      - name: Publish to GitHub Pages
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          exclude_assets: ".github"   # .git is removed in the step above
          keep_files: true
          commit_message: "brief ${{ github.run_id }}"

      - name: Notify
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          export SITE_URL="${SITE_URL_OVERRIDE:-https://${owner,,}.github.io/${repo}/}"
          uv run daily-brief --notify-only

      - name: Delete trigger branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
