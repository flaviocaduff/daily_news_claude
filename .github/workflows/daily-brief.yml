name: Daily Brief

on:
  schedule:
    # GitHub cron is UTC only. Both slots are registered; the gate below lets
    # exactly one through so the brief starts at 06:30 Europe/Zurich all year.
    - cron: "30 4 * * *"  # 06:30 CEST (summer, UTC+2)
    - cron: "30 5 * * *"  # 06:30 CET  (winter, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: no Claude, no publish, no notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: DST gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          off=$(TZ=Europe/Zurich date +%z)
          sched="${{ github.event.schedule }}"
          if { [ "$off" = "+0200" ] && [ "$sched" = "30 4 * * *" ]; } || { [ "$off" = "+0100" ] && [ "$sched" = "30 5 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: Zurich offset $off does not match slot '$sched'"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      # Bring back the previously published site so the archive keeps growing.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true   # first run: gh-pages does not exist yet
        with:
          ref: gh-pages
          path: site

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'

      - name: Test build (no Claude)
        if: steps.gate.outputs.run == 'true' && inputs.dry_run
        run: uv run daily-brief --no-llm

      # Summaries run on the Claude subscription: token from `claude setup-token`.
      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        run: npm install -g @anthropic-ai/claude-code

      # Fails in seconds on a bad/expired token; prints only non-secret facts about it.
      - name: Check Claude token
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          t="$CLAUDE_CODE_OAUTH_TOKEN"
          echo "length: ${#t}"
          case "$t" in sk-ant-oat*) echo "prefix: ok";; *) echo "prefix: NOT sk-ant-oat";; esac
          bad=$(printf '%s' "$t" | tr -d 'A-Za-z0-9_-' | wc -c); echo "unexpected chars: $bad"
          claude --version
          cd "$(mktemp -d)" && claude -p "say ok" --tools "" --no-session-persistence

      - name: Build brief
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run daily-brief

      # The restored gh-pages checkout brings its own .git, which breaks the publish action.
      - name: Drop restored git metadata
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        run: rm -rf site/.git

      - name: Publish to GitHub Pages
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          exclude_assets: ".github"   # .git is removed in the step above
          keep_files: true
          commit_message: "brief ${{ github.run_id }}"

      - name: Notify
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          export SITE_URL="${SITE_URL_OVERRIDE:-https://${owner,,}.github.io/${repo}/}"
          uv run daily-brief --notify-only
