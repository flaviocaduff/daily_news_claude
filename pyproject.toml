[project]
name = "daily-brief"
version = "0.1.0"
description = "Daily one-page news brief (TLDR, Handelsblatt, Inside Paradeplatz) summarised with Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "edge-tts>=7",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "trafilatura>=2.0",
]

[project.scripts]
daily-brief = "daily_brief.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_brief"]
